          maxLength: 50
        othersName:
          type: string
        firstSurName:
          type: string
          minLength: 2
          maxLength: 50
        othersSurName:
          type: string
          maxLength: 100
        dateBirth:
          type: string
          format: date
        located:
          type: string
          maxLength: 100
        locatedEng:
          type: string
          maxLength: 100
        startWorkingDate:
          type: string
          format: date
        greeting:
          type: string
          maxLength: 500
        greetingEng:
          type: string
          maxLength: 500
        email:
          type: string
          format: email
        instagram:
          type: string
          maxLength: 100
        linkedin:
          type: string
          maxLength: 200
        x:
          type: string
          maxLength: 100
        github:
          type: string
          maxLength: 100
        description:
          type: string
        descriptionEng:
          type: string
        descriptionPdf:
          type: array
          items:
            type: string
        descriptionPdfEng:
          type: array
          items:
            type: string
        wrapper:
          type: array
          items:
            type: string
        wrapperEng:
          type: array
          items:
            type: string

    BasicDataResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        othersName:
          type: string
        firstSurName:
          type: string
        othersSurName:
          type: string
        dateBirth:
          type: string
          format: date
        located:
