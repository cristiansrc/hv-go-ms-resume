components:
  schemas:
    # ==================== AUTH SCHEMAS ====================
    LoginRequest:
      type: object
      required:
        - user
        - password
        - altcha
      properties:
        user:
          type: string
          description: Nombre de usuario
        password:
          type: string
          description: Contraseña
        altcha:
          type: string
          description: Respuesta del challenge Altcha

    LoginResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: JWT Bearer Token (validez 24 horas)

    # ==================== PUBLIC SCHEMAS ====================
    ContactRequest:
      type: object
      required:
        - name
        - email
        - message
        - altcha
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        message:
          type: string
          minLength: 1
          maxLength: 2000
        altcha:
          type: string
          description: Respuesta del challenge Altcha

    AltchaChallengeResponse:
      type: object
      properties:
        algorithm:
          type: string
          example: "SHA-256"
        challenge:
          type: string
        salt:
          type: string
        signature:
          type: string

    TemplatesResponse:
      type: object
      required:
        - templates
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/TemplateItem"

    TemplateItem:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          enum:
            - engineeringclassic
            - engineeringresumes
            - moderncv
            - sb2nov
        name:
          type: string

    LanguagesResponse:
      type: object
      required:
        - languages
      properties:
        languages:
          type: array
          items:
            $ref: "#/components/schemas/LanguageItem"

    LanguageItem:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          enum:
            - english
            - spanish
        name:
          type: string

    # ==================== EXISTING ENTITY SCHEMAS ====================
    BasicDataRequest:
      type: object
      required:
        - firstName
        - firstSurName
        - dateBirth
        - email
      properties:
