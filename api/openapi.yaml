  /v1/ms-resume/public/courses:
    get:
      operationId: getPublicCourses
      summary: Listar cursos (solo lectura)
      tags:
        - Public
      security: []
      responses:
        "200":
          description: Lista de cursos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/ms-resume/public/certifications:
    get:
      operationId: getPublicCertifications
