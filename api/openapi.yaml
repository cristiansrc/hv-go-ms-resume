openapi: 3.1.0
info:
  title: hv-go-ms-resume API
  description: |
    Microservicio REST para gestionar la información del portfolio personal y CV.
    Migración de Spring Boot a Go 1.22+ con arquitectura hexagonal.

    - Endpoints `/public/*` y `/login`: sin autenticación
    - Endpoints CRUD: requieren JWT Bearer Token
    - Rate limiting aplicado en todos los endpoints
  version: 2.0.0
  contact:
    name: cristiansrc
    url: https://cristiansrc.com
    email: contacto@cristiansrc.com

servers:
  - url: http://localhost:8080
    description: Desarrollo local
  - url: https://api.cristiansrc.com
    description: Producción

paths:
  # ==================== AUTHENTICATION ====================
  /v1/ms-resume/login:
    post:
      operationId: login
      summary: Autenticar usuario y obtener token JWT
      description: Genera un token JWT para el administrador si las credenciales y Altcha son válidos.
      tags:
        - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"

  # ==================== PUBLIC ENDPOINTS ====================
  /v1/ms-resume/public/info-page:
    get:
      operationId: getInfoPage
      summary: Obtener información completa de la página
      description: Retorna Home, BasicData, Skills (lista plana), Experiences, Educations, Courses, Certifications, Languages, References, CustomSections y Altcha Challenge.
      tags:
        - Public
      security: []
      responses:
        "200":
          description: Información completa obtenida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoPageResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/ms-resume/public/curriculum/{language}:
    get:
      operationId: downloadCurriculum
      summary: Descargar curriculum en PDF
      description: Genera o retorna desde caché el CV en formato PDF.
      tags:
        - Public
      security: []
      parameters:
        - name: language
          in: path
          required: true
          schema:
            type: string
            enum:
              - english
              - spanish
          description: Idioma del curriculum
        - name: template
          in: query
          required: false
          schema:
            type: string
            enum:
              - engineeringclassic
              - engineeringresumes
              - moderncv
              - sb2nov
            default: engineeringclassic
          description: Template de diseño del PDF
      responses:
        "200":
          description: PDF generado exitosamente
          headers:
            Content-Disposition:
              schema:
                type: string
              description: "attachment; filename=curriculum.pdf"
            Content-Type:
              schema:
                type: string
              description: application/pdf
            Content-Length:
              schema:
                type: integer
              description: Tamaño del archivo en bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/ms-resume/public/contact:
    post:
      operationId: sendContactMessage
      summary: Enviar mensaje de contacto
      description: Recibe un mensaje de contacto y notifica vía Telegram Bot.
      tags:
        - Public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "200":
          description: Mensaje enviado exitosamente
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/ms-resume/public/challenge:
    get:
      operationId: getAltchaChallenge
      summary: Obtener challenge de Altcha
      description: Genera un nuevo challenge para validación anti-spam.
      tags:
        - Public
      security: []
      responses:
        "200":
          description: Challenge generado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AltchaChallengeResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/ms-resume/public/blog:
    get:
      operationId: getPublicBlogPage
      summary: Obtener artículos del blog con paginación
      description: Lista paginada de artículos del blog tecnológico.
      tags:
        - Public
      security: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Número de página (base 0)
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Elementos por página
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: "id,desc"
          description: "Campo y dirección (ej: id,desc)"
      responses:
        "200":
          description: Lista paginada obtenida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/ms-resume/public/blog/{id}:
    get:
      operationId: getPublicBlogById
      summary: Obtener artículo del blog por ID
      tags:
        - Public
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Artículo obtenido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogResponse"
        "404":
