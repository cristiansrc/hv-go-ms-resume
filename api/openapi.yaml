        instagram:
          type: string
        linkedin:
          type: string
        x:
          type: string
        github:
          type: string
        description:
          type: string
        descriptionEng:
          type: string
        descriptionPdf:
          type: array
          items:
            type: string
        descriptionPdfEng:
          type: array
          items:
