  /v1/ms-resume/public/blog-type/{id}:
    get:
      operationId: getPublicBlogTypeById
      summary: Obtener tipo de blog por ID
      tags:
        - Public
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Tipo obtenido
          content:
            application/json:
